services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: sh -c "python -m app.db.wait_for_db && python -m app.db.init_db && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    volumes:
      - ./backend/app:/app/app
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.Core.celery_app.celery_app worker --loglevel=info
    env_file:
      - .env
    volumes:
      - ./backend/app:/app/app
      - ./storage:/app/storage
    depends_on:
      - db
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: undicam
      POSTGRES_USER: undicam
      POSTGRES_PASSWORD: undicam
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
